{
    "_comment": "syz-manager config for the ch24 lab kernel. Paths are relative to $SYZKALLER; adjust `workdir`, `kernel_obj`, `image`, `sshkey`, and `kernel` for your checkout. syzkaller needs a bootable rootfs image with an SSH server (create-image.sh from tools/create-image.sh in the syzkaller tree, pinned to Ubuntu 24.04 / Noble to match bible/tech-stack.md); the ch24 lab itself boots from a busybox initramfs and is not directly reusable here.",
    "target":     "linux/amd64",
    "http":       "127.0.0.1:56741",
    "workdir":    "./workdir-ch24",
    "kernel_obj": "../ch24-kernel-intro/linux",
    "image":      "./image/noble.img",
    "sshkey":     "./image/noble.id_rsa",
    "syzkaller":  "./",
    "procs":      2,
    "type":       "qemu",
    "enable_syscalls": [
        "openat$vuln",
        "write$vuln",
        "ioctl$VUL_MAGIC",
        "close"
    ],
    "vm": {
        "count":   2,
        "cpu":     2,
        "mem":     2048,
        "kernel":  "../ch24-kernel-intro/linux/arch/x86/boot/bzImage",
        "cmdline": "console=ttyS0 root=/dev/sda earlyprintk=serial oops=panic panic_on_warn=1 nokaslr"
    }
}
