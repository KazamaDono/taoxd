syntax = "proto3";
package ch30;

message Value {
  oneof v {
    int64  i = 1;
    double f = 2;
    string s = 3;
    bool   b = 4;
  }
}
message KV     { string key = 1; Value val = 2; }
message Group  { string name = 1; repeated KV kvs = 2; repeated Group sub = 3; }
message Config {
  uint32 version = 1;                   // 1..3 in the emitter below
  repeated KV top = 2;
  repeated Group groups = 3;
}
