name: labs

# Builds the deliberately vulnerable lab targets and runs each chapter's
# exploit test on real Ubuntu 24.04. This is the book's "the code works" gate.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 only, deliberately. The lab image is x86-64 and exercises the
        # AArch64 targets by cross-compiling them and running them under
        # qemu-user-static — the same way this CI does — so arm64 coverage is
        # not lost. A *native* arm64 runner cannot build the chapters'
        # x86-64-only artifacts (e.g. ch06 Intel-syntax shellcode, ch09 inline
        # `syscall`/`pop %rax`), which the build system assembles with the host
        # compiler; that is why the ubuntu-24.04-arm matrix entry was removed.
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Install base toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ gdb gdbserver make nasm \
            clang lld llvm libclang-rt-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu qemu-user-static \
            python3 python3-pip ruby ruby-dev tmux \
            file xxd binutils elfutils patchelf libc6-dbg
          pip3 install --break-system-packages --no-cache-dir \
            -r lab/requirements.txt
          sudo gem install --no-document one_gadget -v 1.9.0 || true

      - name: Toolchain doctor
        run: bash scripts/doctor.sh || true

      - name: Build all labs
        run: bash scripts/build-all.sh

      - name: Run all chapter tests
        run: bash scripts/test-all.sh
